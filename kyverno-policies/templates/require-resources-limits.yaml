{{- if .Values.policies.requireResourceLimits.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resources-limits
  labels:
    {{- include "kyverno-policies.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Require Resource Requests and Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Todo Pod debe declarar requests y limits de CPU y memoria para cada
      contenedor. Esto evita que un workload sin control consuma recursos
      del nodo de forma desmedida y complementa al LimitRange/ResourceQuota
      ya definidos a nivel de namespace.
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  validationFailureAction: {{ .Values.global.validationFailureAction | default .Values.policies.requireResourceLimits.validationFailureAction }}
  background: {{ .Values.policies.requireResourceLimits.background }}
  rules:
    - name: validate-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      {{- if .Values.policies.requireResourceLimits.excludeNamespaces }}
      exclude:
        any:
          - resources:
              namespaces:
                {{- toYaml .Values.policies.requireResourceLimits.excludeNamespaces | nindent 16 }}
      {{- end }}
      validate:
        message: "Cada contenedor debe declarar requests y limits de CPU y memoria."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
                    cpu: "?*"
{{- end }}
