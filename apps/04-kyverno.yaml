apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://kyverno.github.io/kyverno"
    chart: kyverno
    targetRevision: 3.8.2
    helm:
      parameters:
        - name: config.keep
          value: "false"
        - name: crds.keep
          value: "false"
        - name: config.failurePolicy
          value: "Ignore"
        - name: admissionController.failurePolicy
          value: "Ignore"
        - name: webhooksCleanup.enabled
          value: "true"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kyverno

  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      # - ServerSideApply=true
      # - ServerSideDiff=true
    retry:
      limit: 2
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
