{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cluster-governance.serviceAccountName" . }}
  namespace: {{ include "cluster-governance.namespaceName" . }}
  labels:
    {{- include "cluster-governance.labels" . | nindent 4 }}
  {{- with (merge (deepCopy .Values.commonAnnotations) .Values.serviceAccount.annotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
