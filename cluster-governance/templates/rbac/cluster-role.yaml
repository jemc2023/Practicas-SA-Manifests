{{- if .Values.rbac.clusterRole.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # Los objetos cluster-scoped no tienen namespace: se incluye el namespace
  # destino en el nombre para evitar colisiones entre distintos releases.
  name: {{ include "cluster-governance.fullname" . }}-{{ include "cluster-governance.namespaceName" . }}-cluster-reader
  labels:
    {{- include "cluster-governance.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  {{- toYaml .Values.rbac.clusterRole.rules | nindent 2 }}
{{- end }}
