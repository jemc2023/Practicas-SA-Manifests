{{- if .Values.rbac.clusterRole.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cluster-governance.fullname" . }}-{{ include "cluster-governance.namespaceName" . }}-cluster-reader-binding
  labels:
    {{- include "cluster-governance.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cluster-governance.fullname" . }}-{{ include "cluster-governance.namespaceName" . }}-cluster-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "cluster-governance.serviceAccountName" . }}
    namespace: {{ include "cluster-governance.namespaceName" . }}
{{- end }}
