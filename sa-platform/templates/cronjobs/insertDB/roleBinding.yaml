apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job1-rolebinding
  namespace: {{ .Values.global.namespace }}
subjects:
  - kind: ServiceAccount
    name: job1-sa
    namespace: {{ .Values.global.namespace }}
roleRef:
  kind: Role
  name: job1-role
  apiGroup: rbac.authorization.k8s.io
