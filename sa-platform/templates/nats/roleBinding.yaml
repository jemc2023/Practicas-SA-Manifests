apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nats-init-rolebinding
  namespace: {{ .Values.global.namespace }}
subjects:
  - kind: ServiceAccount
    name: nats-init-sa
    namespace: {{ .Values.global.namespace }}
roleRef:
  kind: Role
  name: nats-init-role
  apiGroup: rbac.authorization.k8s.io
