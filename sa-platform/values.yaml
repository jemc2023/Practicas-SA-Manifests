audit-logs:
  replicaCount: 2
  revisionHistoryLimit: 1
  image:
    repository: ghcr.io/jemc2023/audit-logs
    tag: *tag_val
  logLevel: info
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
  autoscaling:
    minReplicas: 2
    maxReplicas: 3
  db:
    uri: ""
    port: 27017

