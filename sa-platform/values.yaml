globalVars:
  tag: &tag_val "v1.8.5"

global:
  namespace: sa-p5
  namespaceOverride: sa-p5
  environment: dev
  security:
    allowInsecureImages: true
  ghcr: "yes"

ghcr:
  json: ""

resourceQuota:
  enabled: true
  requestsCpu: "3.5"
  requestsMemory: 8Gi
  limitsCpu: "6"
  limitsMemory: 10Gi
  pods: "45"
  pvcs: "10"
  services: "15"

limitRange:
  enabled: true
  defaultCpu: 250m
  defaultMemory: 256Mi
  defaultRequestCpu: 50m
  defaultRequestMemory: 64Mi
  maxCpu: "1"
  maxMemory: 512Mi
  minCpu: 20m
  minMemory: 32Mi

networkPolicy:
  defaultDenyAll: true

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: api.local
      paths:
        - path: /
          pathType: Prefix
          service: api-gateway-service
          port: 8080

natsStream:
  name: AUDIT_STREAM
  subjects:
    - "audit.>"
  storage: file
  retention: interest
  numReplicas: 1

nats:
  enabled: true
  namespaceOverride: sa-p5
  fullnameOverride: nats
  natsBox:
    enabled: false
  podTemplate:
    merge:
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
  config:
    override: |
      server_name: nats-server
      http_port: 8222
      jetstream {
          store_dir: "/data"
      }
    jetstream:
      enabled: true
      fileStore:
        pvc:
          enabled: true
          size: 1Gi
          storageClass: "standard-rwo"
  container:
    image:
      repository: nats
      tag: "2.14.0-alpine"
    merge:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
  reloader:
    enabled: false

audit-logs-db:
  enabled: true
  namespaceOverride: sa-p5
  architecture: replicaset
  replicaCount: 1
  arbiter:
    enabled: false
  image:
    registry: docker.io
    repository: bitnamilegacy/mongodb
    tag: 8.0.13-debian-12-r0
  auth:
    enabled: true
    rootUser: root
    keepCreatedSecret: false
    existingSecret: sa-platform-audit-logs-db
  persistence:
    enabled: true
    size: 1Gi
    storageClass: "standard-rwo" # Se agrega por la nube
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

