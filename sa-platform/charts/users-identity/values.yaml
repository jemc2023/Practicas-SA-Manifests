global:
  environment: dev

replicaCount: 1

image:
  repository: docker-users_identity_service
  tag: ""
  pullPolicy: IfNotPresent

port: 3000
healthPath: /
logLevel: info

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

service:
  type: ClusterIP

serviceAccount:
  automount: false

rbac:
  rules: []

env:
  USERS_PORT: "3000"
  JWT_AT_EXPIRES_IN: "10d"
  JWT_RT_EXPIRES_IN: "7d"
  NATS_SERVER_URL: "nats://nats:4222"

secretEnv:
  JWT_SECRET: "change-me-in-production"

db:
  envKey: USERS_IDENTITY_DB_URI
  uri: sa-platform-users-identity-db-headless

networkPolicy:
  enabled: true
  ingressFrom:
    - app: api-gateway
  egressExtra:
    - selector:
        app.kubernetes.io/name: nats
        app.kubernetes.io/instance: sa-platform
        app.kubernetes.io/component: nats
      port: 4222
    - selector:
        app.kubernetes.io/name: users-identity-db
        app.kubernetes.io/instance: sa-platform
      port: 27017
