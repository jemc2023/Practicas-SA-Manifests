{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Chart.Name }}-netpol
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "sa-platform.selectorLabels" . | nindent 6 }}

  policyTypes:
    - Ingress
    - Egress

  {{- if .Values.networkPolicy.ingressFrom }}
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressFrom }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.port }}
  {{- end }}

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- range .Values.networkPolicy.egressExtra }}
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .selector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
{{- end }}
