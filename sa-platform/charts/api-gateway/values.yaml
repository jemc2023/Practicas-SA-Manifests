global:
  environment: dev
  namespace: sa-p5

replicaCount: 1

image:
  repository: docker-api_gateway
  tag: ""
  pullPolicy: IfNotPresent

port: 8080
healthPath: /
logLevel: info

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

service:
  type: LoadBalancer #En el caso de nube, para facilitar se usa el LoadBalancer
  # type: ClusterIP

serviceAccount:
  automount: false

rbac:
  rules: []

env:
  API_GATEWAY_PORT: "8080"
  PRODUCTS_SERVICE_URL: "http://products-service:4000/graphql"
  INTERACTIONS_SERVICE_URL: "http://interactions-service:4000/graphql"
  AUDIT_LOGS_SERVICE_URL: "http://audit-logs-service:8000/audit-logs"
  NATS_SERVER_URL: "nats://nats:4222"

secretEnv:
  JWT_SECRET: "change-me-in-production"

networkPolicy:
  enabled: true
  ingressFrom:
    - app.kubernetes.io/name: ingress-nginx
  egressExtra:
    - selector:
        app: audit-logs
      port: 8000
    - selector:
        app: users-identity
      port: 3000
    - selector:
        app: products
      port: 4000
    - selector:
        app: interactions
      port: 4000
