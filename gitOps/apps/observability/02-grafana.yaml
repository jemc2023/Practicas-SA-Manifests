apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obs-grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 13.2.7
    helm:
      releaseName: grafana
      valuesObject:
        fullnameOverride: grafana
        adminUser: admin
        adminPassword: "admin123"
        replicas: 1
        persistence:
          enabled: false
        testFramework:
          enabled: false
        sidecar:
          datasources:
            enabled: true
            label: grafana_datasource
          dashboards:
            enabled: true
            label: grafana_dashboard
            folderAnnotation: grafana_folder
            provider:
              foldersFromFilesStructure: true
          alerts:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 2
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
