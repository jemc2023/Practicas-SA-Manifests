apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obs-grafana-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jemc2023/Practicas-SA-Manifests.git
    targetRevision: master
    path: gitOps/grafana-config
    helm:
      releaseName: grafana-config
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Los dashboards reales pueden superar el límite de 256 KB de la
      # annotation de client-side apply; Server-Side Apply lo evita.
      - ServerSideApply=true
    retry:
      limit: 2
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
