apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Chart.Name }}-role
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
  namespace: {{ .Values.global.namespace }}
rules:
  {{- if .Values.rbac.rules }}
  {{- toYaml .Values.rbac.rules | nindent 2 }}
  {{- else }}
  []
  {{- end }}
