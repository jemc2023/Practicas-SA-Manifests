{{- if .Values.policies.requireRunAsNonRoot.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-nonroot
  labels:
    {{- include "kyverno-policies.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Require Run As Non-Root User
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Los contenedores no deben ejecutarse como root. Esta política exige que
      runAsNonRoot esté en true, ya sea definido a nivel de Pod (securityContext
      general, aplica a todos los contenedores) o de forma explícita en cada
      contenedor individual.
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  validationFailureAction: {{ .Values.global.validationFailureAction | default .Values.policies.requireRunAsNonRoot.validationFailureAction }}
  background: {{ .Values.policies.requireRunAsNonRoot.background }}
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      {{- if .Values.policies.requireRunAsNonRoot.excludeNamespaces }}
      exclude:
        any:
          - resources:
              namespaces:
                {{- toYaml .Values.policies.requireRunAsNonRoot.excludeNamespaces | nindent 16 }}
      {{- end }}
      validate:
        message: "Los contenedores no pueden ejecutarse como root. Define securityContext.runAsNonRoot: true a nivel de Pod o de cada contenedor."
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
          - spec:
              containers:
                - securityContext:
                    runAsNonRoot: true
{{- end }}
